name: Design guardrails

# Runs the design-system checks on every PR that touches UI code. Vercel builds
# the same tree, and `prebuild` runs check-tokens there too, but a named CI job
# fails the PR with the actual violation list instead of a build log.

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "scripts/design/**"
      - "scripts/check-design-ratchet.mjs"
      - "scripts/design-ratchet-baseline.json"
      - "scripts/check-crons.mjs"
      - "vercel.json"
      - "next.config.mjs"
      - ".github/workflows/design-guardrails.yml"

jobs:
  check-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: No raw colour outside app/styles/tokens.css; styled inline props under the ceiling
        run: node scripts/design/check-tokens.mjs

  check-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Referenced assets exist, font weights are backed by real faces, inline layout styles do not grow
        run: node scripts/design/check-assets.mjs

  design-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Inline style blocks and page-prefixed selectors do not grow
        run: node scripts/check-design-ratchet.mjs

  check-old-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Retired per-feature class names do not come back
        run: node scripts/design/check-old-names.mjs

  check-crons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Every cron path reaches a handler instead of a 308
        run: node scripts/check-crons.mjs
